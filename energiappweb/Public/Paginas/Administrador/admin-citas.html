<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnergiApp | Admin Citas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../estilo/indexStyles.css" />
  </head>
  <body class="dashboard-body">
    <div class="dashboard-shell">
      <aside class="sidebar admin-sidebar">
        <div class="sidebar-brand">
          <div class="brand-mark">⚡</div>
          <div>
            <h3>EnergiApp</h3>
            <small>Administrador</small>
          </div>
        </div>

        <nav class="nav-menu">
          <a href="/admin-dashboard">🏠 Dashboard</a>
          <a href="/Paginas/Administrador/admin-usuarios.html">👥 Usuarios</a>
          <a href="/Paginas/Administrador/admin-paneles.html">🔋 Paneles</a>
          <a class="active" href="/Paginas/Administrador/admin-citas.html">📅 Citas</a>
          <a href="/Paginas/Administrador/admin-mantenimiento.html">🛠️ Mantenimiento</a>
          <a href="/Paginas/Administrador/admin-reportes.html">📊 Reportes</a>
        </nav>

        <div class="sidebar-card">
          <span class="badge">Citas</span>
          <strong id="totalCitas">0</strong>
          <small>Este mes</small>
        </div>
      </aside>

      <main class="dashboard-main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Agenda</p>
            <h2>Citas programadas</h2>
          </div>
          <div class="actions">
            <button class="ghost-btn">Nueva cita</button>
            <a href="index.html" class="primary-btn small-btn">Salir</a>
          </div>
        </header>

        <section class="panel table-panel">
          <div class="panel-head">
            <h3>Próximas citas</h3>
          </div>
          <table>
            <thead>
              <tr>
                <th>Cliente</th>
                <th>Servicio</th>
                <th>Fecha</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="4" style="text-align: center; color: #64748b; padding: 20px;">No hay citas asociadas a esta empresa.</td>
              </tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>
    <script src="../../Logica/adminCitas.js"></script>
  </body>
</html>
