<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnergiApp | Usuario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../estilo/indexStyles.css" />
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <aside class="auth-hero">
          <div class="brand-logo">⚡</div>
          <h1>EnergiApp</h1>
          <p>Potencia tu futuro con energía solar inteligente</p>
          <ul class="mini-features">
            <li>Monitoreo de consumo</li>
            <li>Gestión de viviendas</li>
            <li>Reportes energéticos</li>
          </ul>
        </aside>

        <main class="auth-form-panel">
          <div class="topbar-inline">
            <a href="index.html" class="back-link">← Volver</a>
          </div>

          <div class="form-header">
            <h2>Bienvenido de nuevo</h2>
            <p>Ingresa tus credenciales para continuar</p>
          </div>

          <form class="form-box">
            <label>
              <span>Correo electrónico</span>
              <input type="email" placeholder="usuario@energiapp.com" />
            </label>

            <label>
              <span>Contraseña</span>
              <input type="password" placeholder="••••••••" />
            </label>

            <div class="row-between">
              <label class="checkbox-row">
                <input type="checkbox" />
                <span>Recordarme</span>
              </label>
              <a href="#">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="primary-btn">Iniciar Sesión</button>
          </form>

          <div class="separator"><span>o</span></div>

          <a href="/dashboard" class="secondary-btn">Entrar al Dashboard</a>
        </main>
      </div>
    </div>
  </body>
</html>
