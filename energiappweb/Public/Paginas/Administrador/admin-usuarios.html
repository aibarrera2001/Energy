<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnergiApp | Admin Usuarios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../estilo/indexStyles.css" />
  </head>
  <body class="dashboard-body">
    <div class="dashboard-shell">
      <aside class="sidebar admin-sidebar">
        <div class="sidebar-brand">
          <div class="brand-mark">⚡</div>
          <div>
            <h3>EnergiApp</h3>
            <small>Administrador</small>
          </div>
        </div>

        <nav class="nav-menu">
          <a href="/admin-dashboard">🏠 Dashboard</a>
          <a class="active" href="/Paginas/Administrador/admin-usuarios.html">👥 Usuarios</a>
          <a href="/Paginas/Administrador/admin-paneles.html">🔋 Paneles</a>
          <a href="/Paginas/Administrador/admin-citas.html">📅 Citas</a>
          <a href="/Paginas/Administrador/admin-mantenimiento.html">🛠️ Mantenimiento</a>
          <a href="/Paginas/Administrador/admin-reportes.html">📊 Reportes</a>
        </nav>

        <div class="sidebar-card">
          <span class="badge" id="sidebarBadge">Usuarios</span>
          <strong id="sidebarMetric">0</strong>
          <small id="sidebarMetricLabel">Registrados</small>
        </div>
      </aside>

      <main class="dashboard-main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Gestión</p>
            <h2>Usuarios</h2>
          </div>
          <div class="actions">
            <button class="ghost-btn">Nuevo usuario</button>
            <a href="index.html" class="primary-btn small-btn">Salir</a>
          </div>
        </header>

        <section class="panel table-panel">
          <div class="panel-head">
            <h3>Listado de usuarios</h3>
            <a href="#">Exportar</a>
          </div>
          <table>
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Email</th>
                <th>Tipo</th>
                <th>Estado</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="4" style="text-align: center; color: #64748b; padding: 20px;">No hay usuarios asociados a esta empresa en la base de datos.</td>
              </tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>
    <script>
      const storedEmpresa = JSON.parse(localStorage.getItem('adminEmpresa') || 'null');

      if (!storedEmpresa || !storedEmpresa.id_empresa) {
        window.location.href = '/admin-login';
      } else {
        const badge = document.getElementById('sidebarBadge');
        const metric = document.getElementById('sidebarMetric');
        const label = document.getElementById('sidebarMetricLabel');

        badge.textContent = 'Usuarios';
        label.textContent = 'Registrados';

        fetch(`/api/admin/dashboard/${storedEmpresa.id_empresa}`)
          .then((response) => response.json())
          .then((data) => {
            if (!data.exito) throw new Error(data.mensaje || 'No se pudo cargar la información.');
            metric.textContent = data.metrics?.usuarios ?? 0;
          })
          .catch((error) => {
            console.error(error);
            metric.textContent = '0';
          });
      }
    </script>
  </body>
</html>
