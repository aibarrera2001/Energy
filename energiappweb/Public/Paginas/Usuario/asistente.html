<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnergiApp | Asistente IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../estilo/indexStyles.css" />
  </head>
  <body class="dashboard-body">
    <div class="dashboard-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-mark">⚡</div>
          <div>
            <h3>EnergiApp</h3>
            <small>Usuario</small>
          </div>
        </div>

        <nav class="nav-menu" aria-label="Menú principal">
          <div class="nav-home-wrap">
            <button class="nav-home-trigger active" type="button" aria-expanded="false">🏠 Inicio <span>▾</span></button>
            <div class="nav-submenu open">
              <a href="/dashboard">📊 Dashboard</a>
              <a href="/Paginas/Usuario/propiedades.html">🏡 Propiedades</a>
              <a href="/Paginas/Usuario/paneles.html">🔋 Paneles</a>
              <a href="/Paginas/Usuario/citas.html">📅 Citas</a>
              <a href="/Paginas/Usuario/reportes.html">📊 Reportes</a>
              <a class="active" href="/Paginas/Usuario/asistente.html">🤖 Asistente IA</a>
            </div>
          </div>
        </nav>

        <div class="sidebar-card">
          <span class="badge">IA</span>
          <strong>Online</strong>
          <small>Disponible</small>
        </div>
      </aside>

      <main class="dashboard-main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Asistente</p>
            <h2>Chat EnergiApp</h2>
          </div>
          <div class="actions">
            <button class="ghost-btn">Nueva consulta</button>
            <a href="/usuario-login" class="primary-btn small-btn" onclick="localStorage.clear()">Salir</a>
          </div>
        </header>

        <section class="chat-panel panel" id="chatPanel">
          <div id="historialChat" style="display:flex; flex-direction:column; gap:12px; max-height: 420px; overflow:auto; padding-right:6px;">
            <p style="padding: 15px; color: #666; margin: 0;">Cargando historial del asistente...</p>
          </div>

          <div class="chat-input-box">
            <input id="chatInput" type="text" placeholder="Escribe tu consulta..." />
            <button class="primary-btn" id="btnEnviarChat">Enviar</button>
          </div>
        </section>
      </main>
    </div>
    <script src="../../Logica/asistente.js"></script>
  </body>
</html>
