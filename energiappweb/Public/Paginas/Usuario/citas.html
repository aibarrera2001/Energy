<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnergiApp | Citas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../estilo/indexStyles.css" />
  </head>
  <body class="dashboard-body">
    <div class="dashboard-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-mark">⚡</div>
          <div>
            <h3>EnergiApp</h3>
            <small>Usuario</small>
          </div>
        </div>

        <nav class="nav-menu">
          <a href="dashboard.html">🏠 Dashboard</a>
          <a href="propiedades.html">🏡 Propiedades</a>
          <a href="paneles.html">🔋 Paneles</a>
          <a class="active" href="citas.html">📅 Citas</a>
          <a href="reportes.html">📊 Reportes</a>
          <a href="asistente.html">🤖 Asistente IA</a>
        </nav>

        <div class="sidebar-card">
          <span class="badge">Citas</span>
          <strong id="totalCitasBadge">00</strong>
          <small>Próximas</small>
        </div>
      </aside>

      <main class="dashboard-main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Agenda</p>
            <h2>Mis citas</h2>
          </div>
          <div class="actions">
            <button class="ghost-btn" onclick="document.getElementById('fechaCita').focus()">Agendar</button>
            <a href="index.html" onclick="localStorage.clear()" class="primary-btn small-btn">Salir</a>
          </div>
        </header>

        <section class="content-grid">
          <div class="panel">
            <div class="panel-head">
              <h3>Solicitar cita</h3>
            </div>
            <!-- SE AGREGÓ EL ID AL FORMULARIO -->
            <form class="booking-form" id="formCita">
              <label>
                <span>Tipo de servicio</span>
                <select id="tiposervicio">
                  <option value="MANTENIMIENTO">Mantenimiento preventivo</option>
                  <option value="INSTALACION">Instalación</option>
                  <option value="INSPECCION">Revisión técnica</option>
                  <option value="COTIZACION">Cotización</option>
                </select>
              </label>
              <label>
                <span>Fecha</span>
                <input type="date" id="fechaCita" required />
              </label>
              <label>
                <span>Hora</span>
                <input type="time" id="horaCita" required />
              </label>
              <label>
                <span>Comentario</span>
                <textarea id="comentarioCita" rows="4" placeholder="Describa la necesidad..."></textarea>
              </label>
              <!-- CAMBIADO DE type="button" A type="submit" -->
              <button type="submit" class="primary-btn">Guardar cita</button>
            </form>
          </div>

          <div class="panel">
            <div class="panel-head">
              <h3>Próximas</h3>
            </div>
            <!-- CONTENEDOR DONDE SE CARGARÁN LAS CITAS DINÁMICAMENTE -->
            <div class="timeline" id="contenedorCitas">
              <p style="padding: 15px; color: #666;">Cargando citas...</p>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- VINCULACIÓN DE ARCHIVOS JAVASCRIPT -->
    <script src="../../Paginas/Principal/verificacionInicioseccion.js"></script>
    <script src="../../Logica/Cita.js"></script>
  </body>
</html>
