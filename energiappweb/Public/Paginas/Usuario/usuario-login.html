<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnergiApp | Usuario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../estilo/pages.css" >
    <link rel="stylesheet" href="../../estilo/indexStyles.css" >
    <link rel="stylesheet" href="../../estilo/registrostyle.css">
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-card">
        <aside class="auth-hero">
          <div class="brand-logo">⚡</div>
          <h1>EnergiApp</h1>
          <p>Potencia tu futuro con energía solar inteligente</p>
          <ul class="mini-features">
            <li>Monitoreo de consumo</li>
            <li>Gestión de viviendas</li>
            <li>Reportes energéticos</li>
          </ul>
        </aside>

        <main class="auth-form-panel">
          <div class="topbar-inline">
            <a href="/" class="back-link">← Volver</a>
          </div>

          <div class="form-header">
            <h2>Bienvenido de nuevo</h2>
            <p>Ingresa tus credenciales para continuar</p>
          </div>

          <!-- CORREGIDO: id agregado para poder engancharlo con JS -->
          <div class="error-message" id="errorMessage" style="display:none; background:#ffebee; color:#c62828; padding:12px; border-radius:6px; margin-bottom:16px; font-size:13px;"></div>

          <form class="form-box" id="loginForm">
            <label>
              <span>Correo electrónico</span>
              <!-- CORREGIDO: id agregado -->
              <input type="email" id="correo" placeholder="usuario@energiapp.com" required />
            </label>

            <label>
              <span>Contraseña</span>
              <!-- CORREGIDO: id agregado -->
              <input type="password" id="contrasena" placeholder="••••••••" required />
            </label>

            <div class="row-between">
              <label class="checkbox-row">
                <input type="checkbox" />
                <span>Recordarme</span>
              </label>
              <a href="#">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="primary-btn" id="btnIngresar">Iniciar Sesión</button>
          </form>

          <div class="separator"><span>o</span></div>

          <a href="/usuario-registro" class="secondary-btn">Crear una cuenta</a>
        </main>
      </div>
    </div>

    <!-- CORREGIDO: antes no había NINGÚN script en esta página, por eso el botón
         no hacía nada: el form hacía un submit nativo (recarga vacía) en vez de
         llamar a /api/usuarios/login -->
    <script>
      const form = document.getElementById('loginForm');
      const btnIngresar = document.getElementById('btnIngresar');
      const errorDiv = document.getElementById('errorMessage');

      function mostrarError(mensaje) {
        if (!mensaje) {
          errorDiv.style.display = 'none';
          return;
        }
        errorDiv.textContent = mensaje;
        errorDiv.style.display = 'block';
      }

      async function parseJsonSeguro(response) {
        const contentType = response.headers.get('content-type') || '';
        if (contentType.includes('application/json')) {
          return response.json();
        }
        const text = await response.text();
        if (!text) return {};
        try {
          return JSON.parse(text);
        } catch {
          return { exito: false, mensaje: text || 'Error de conexión con el servidor' };
        }
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        mostrarError('');

        const correo = document.getElementById('correo').value.trim();
        const contrasena = document.getElementById('contrasena').value;

        if (!correo || !contrasena) {
          mostrarError('Por favor completa todos los campos');
          return;
        }

        btnIngresar.disabled = true;
        btnIngresar.textContent = 'Ingresando...';

        try {
          const response = await fetch('/api/usuarios/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ correo, contrasena })
          });

          const data = await parseJsonSeguro(response);

          if (!response.ok || !data.exito) {
            throw new Error(data.mensaje || 'Error al iniciar sesión');
          }

          localStorage.setItem('usuarioId', data.datos.id);
          localStorage.setItem('usuarioNombre', data.datos.nombre);
          localStorage.setItem('usuarioCorreo', data.datos.correo);

          window.location.href = '/dashboard';
        } catch (error) {
          console.error('Error:', error);
          mostrarError(error.message || 'Error de conexión con el servidor');
          btnIngresar.disabled = false;
          btnIngresar.textContent = 'Iniciar Sesión';
        }
      });
    </script>
  </body>
</html>
