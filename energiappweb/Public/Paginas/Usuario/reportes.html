<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnergiApp | Reportes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../estilo/indexStyles.css" />
  </head>
  <body class="dashboard-body">
    <div class="dashboard-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-mark">⚡</div>
          <div>
            <h3>EnergiApp</h3>
            <small>Usuario</small>
          </div>
        </div>

        <nav class="nav-menu" aria-label="Menú principal">
          <div class="nav-home-wrap">
            <button class="nav-home-trigger active" type="button" aria-expanded="false">🏠 Inicio <span>▾</span></button>
            <div class="nav-submenu open">
              <a href="/dashboard">📊 Dashboard</a>
              <a href="/Paginas/Usuario/propiedades.html">🏡 Propiedades</a>
              <a href="/Paginas/Usuario/paneles.html">🔋 Paneles</a>
              <a href="/Paginas/Usuario/citas.html">📅 Citas</a>
              <a class="active" href="/Paginas/Usuario/reportes.html">📊 Reportes</a>
              <a href="/Paginas/Usuario/asistente.html">🤖 Asistente IA</a>
            </div>
          </div>
        </nav>

        <div class="sidebar-card">
          <span class="badge">Finanzas</span>
          <strong id="finanzasBadge">$0</strong>
          <small id="finanzasLabel">Sin datos</small>
        </div>
      </aside>

      <main class="dashboard-main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Análisis</p>
            <h2>Reportes</h2>
          </div>
          <div class="actions">
            <button class="ghost-btn">Exportar PDF</button>
            <a href="/usuario-login" class="primary-btn small-btn" onclick="localStorage.clear()">Salir</a>
          </div>
        </header>

        <section class="stats-grid">
          <article class="stat-card accent">
            <span>Generación</span>
            <strong id="reporteGeneracion">0 kWh</strong>
            <small id="reporteGeneracionTexto">Sin propiedades</small>
          </article>
          <article class="stat-card">
            <span>Consumo</span>
            <strong id="reporteConsumo">0 kWh</strong>
            <small id="reporteConsumoTexto">Sin datos</small>
          </article>
          <article class="stat-card">
            <span>Ahorro</span>
            <strong id="reporteAhorro">0%</strong>
            <small id="reporteAhorroTexto">Sin datos</small>
          </article>
          <article class="stat-card">
            <span>Estado</span>
            <strong id="reporteEstado">Sin datos</strong>
            <small id="reporteEstadoTexto">Sin propiedades</small>
          </article>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h3>Reportes por casa</h3>
          </div>
          <div id="reportesContainer">
            <p style="padding:15px;color:#666;">Cargando reportes...</p>
          </div>
        </section>
      </main>
    </div>
    <script src="../../Logica/verificacionInicioseccion.js"></script>
    <script src="../../Logica/reportesUsuario.js"></script>
  </body>
</html>
