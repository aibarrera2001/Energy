<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnergiApp | Propiedades</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../estilo/indexStyles.css" />
  </head>
  <body class="dashboard-body">
    <div class="dashboard-shell">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <div class="brand-mark">⚡</div>
          <div>
            <h3>EnergiApp</h3>
            <small>Usuario</small>
          </div>
        </div>

        <nav class="nav-menu">
          <a href="dashboard.html">🏠 Dashboard</a>
          <a class="active" href="propiedades.html">🏡 Propiedades</a>
          <a href="paneles.html">🔋 Paneles</a>
          <a href="citas.html">📅 Citas</a>
          <a href="reportes.html">📊 Reportes</a>
          <a href="asistente.html">🤖 Asistente IA</a>
        </nav>

        <div class="sidebar-card">
          <span class="badge">Propiedades</span>
          <strong id="cantidadPropiedades">0</strong>
          <small id="textoCantidadPropiedades">Casas activas</small>
        </div>
      </aside>

      <main class="dashboard-main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Gestión</p>
            <h2>Mis propiedades</h2>
          </div>
          <div class="actions">
            <button class="ghost-btn" id="toggleFormBtn">Nueva propiedad</button>
            <a href="../Principal/index.html" class="primary-btn small-btn">Salir</a>
          </div>
        </header>

        <section class="panel" id="formPropiedadPanel" style="display: none; margin-bottom: 20px;">
          <div class="panel-head">
            <h3>Registrar nueva propiedad</h3>
          </div>
          <form id="formPropiedad" class="booking-form">
            <label>
              <span>Dirección</span>
              <input type="text" id="direccionPropiedad" placeholder="Cra 12 # 4-56" required />
            </label>
            <label>
              <span>Ciudad</span>
              <input type="text" id="ciudadPropiedad" placeholder="Valledupar" required />
            </label>
            <label>
              <span>Tipo de propiedad</span>
              <select id="tipoPropiedad">
                <option value="CASA">Casa</option>
                <option value="APARTAMENTO">Apartamento</option>
                <option value="EDIFICIO">Edificio</option>
              </select>
            </label>
            <label>
              <span>Consumo mensual (kWh)</span>
              <input type="number" id="consumoMensual" min="0" step="0.01" value="0" />
            </label>
            <label>
              <span>Área de techo (m²)</span>
              <input type="number" id="areaTecho" min="0" step="0.01" value="0" />
            </label>
            <button type="submit" class="primary-btn">Guardar propiedad</button>
          </form>
        </section>

        <section class="cards-grid property-grid" id="propertyGrid">
          <p style="padding: 15px; color: #666;">Cargando propiedades...</p>
        </section>
      </main>
    </div>

    <script src="../../Logica/propiedades.js"></script>
  </body>
</html>
